name: iOS

on:
  push:
    branches: [ios-port]
    tags: ['*-ios*']
  pull_request:
  workflow_dispatch:

env:
  PROJECT: OpenUtauMobile/OpenUtauMobile.csproj
  TFM: net9.0-ios
  BUNDLE_ID: pers.vocoder712.openutaumobile
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # The runner image also has newer SDKs (.NET 11), which would otherwise win
      # and install workloads that can't build net9.0-ios.
      - name: Pin .NET 9 SDK
        run: |
          V="$(dotnet --list-sdks | awk '/^9\./{print $1}' | sort -V | tail -1)"
          echo "{\"sdk\":{\"version\":\"$V\",\"rollForward\":\"disable\"}}" > global.json
          cat global.json
          dotnet --version

      - name: Install iOS workload
        run: |
          dotnet workload install maui-ios
          dotnet workload list

      # Use the Xcode the iOS workload was built against (Microsoft.iOS.Sdk.net9.0_<xcode>),
      # falling back to the image default, and make sure it is fully set up.
      - name: Select Xcode
        run: |
          WANT="$(ls "$DOTNET_ROOT/packs" ~/.dotnet/packs 2>/dev/null | sed -n 's/^Microsoft\.iOS\.Sdk\.net9\.0_//p' | sort -V | tail -1)"
          echo "workload expects Xcode $WANT"
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_${WANT}*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          sudo xcodebuild -runFirstLaunch || true
          XV="$(xcodebuild -version | tr '\n' ' ')"
          ACTOOL="$(xcrun --find actool 2>&1 || true)"
          RUNTIMES="$(xcrun simctl list runtimes 2>&1 | grep -i ios | tr '\n' ';')"
          # The build's actool lookup (xcrun -sdk <MacOSX.sdk> actool) falls back to
          # `xcodebuild -find`, which fails on the runner; xcrun also searches PATH.
          echo "$(xcode-select -p)/usr/bin" >> "$GITHUB_PATH"
          MACSDK="$(xcrun --sdk macosx --show-sdk-path)"
          FIND="$(xcodebuild -sdk "$MACSDK" -find actool 2>&1 | tail -3 | tr '\n' ' ')"
          VIA="$(xcrun -sdk "$MACSDK" -f actool 2>&1 | tr '\n' ' ')"
          echo "::notice title=actool lookup::xcodebuild -find: $FIND | xcrun -sdk macsdk -f: $VIA"
          echo "::notice title=Toolchain::workload Xcode=$WANT | selected $(xcode-select -p) | $XV | actool=$ACTOOL | sim runtimes: $RUNTIMES | installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"

      # ---------------------------------------------------- native library --
      - name: Cache worldline.xcframework
        id: native-cache
        uses: actions/cache@v4
        with:
          path: OpenUtauMobile/Platforms/iOS/Native/worldline.xcframework
          key: worldline-ios-${{ hashFiles('native/**') }}

      - name: Build worldline.xcframework
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash native/ios/build_worldline_ios.sh

      # ------------------------------------------------- simulator + smoke --
      - name: Build for simulator
        run: |
          set -o pipefail
          dotnet build "$PROJECT" -f $TFM -c Release -r iossimulator-arm64             -p:EnableCodeSigning=false -p:IosOnly=true 2>&1 | tee build-sim.log

      - name: Simulator smoke test
        run: |
          set -x
          APP="$(find OpenUtauMobile/bin/Release/$TFM/iossimulator-arm64 -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "app: $APP"
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for rt,devs in sorted(d.items(), reverse=True) if "iOS" in rt for x in devs if x["name"].startswith("iPhone")]
          print(ids[0])')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p smoke
          xcrun simctl launch --terminate-running-process \
            --stdout="$PWD/smoke/stdout.txt" --stderr="$PWD/smoke/stderr.txt" \
            "$UDID" "$BUNDLE_ID"
          sleep 60
          xcrun simctl io "$UDID" screenshot smoke/home.png
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          cp -R "$DATA/Library" smoke/app-library 2>/dev/null || true
          xcrun simctl spawn "$UDID" launchctl list | grep -i openutau > smoke/process.txt || echo "PROCESS NOT RUNNING" > smoke/process.txt
          cat smoke/stdout.txt smoke/stderr.txt | grep '\[ios-port\]' || true
          cat smoke/process.txt
          # Fail if the app died or a native dependency did not load.
          if grep -q "NOT RUNNING" smoke/process.txt; then echo "::error::app is not running"; exit 1; fi
          if grep -q '\[ios-port\].*FAIL' smoke/stdout.txt; then echo "::error::native self-check failed"; exit 1; fi
          grep -q '\[ios-port\] worldline-pinvoke: OK' smoke/stdout.txt
          grep -q '\[ios-port\] onnxruntime: OK' smoke/stdout.txt

      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/report_errors.py build-sim.log build-device.log

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-test
          path: smoke/

      # ------------------------------------------------------ device build --
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          dotnet build "$PROJECT" -f $TFM -c Release -r ios-arm64             -p:EnableCodeSigning=false -p:IosOnly=true 2>&1 | tee build-device.log

      - name: Package unsigned IPA
        run: |
          APP="$(find OpenUtauMobile/bin/Release/$TFM/ios-arm64 -maxdepth 2 -name '*.app' -type d | head -1)"
          VERSION="$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' "$PROJECT")"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../OpenUtauMobile-$VERSION-ios-unsigned.ipa" Payload)
          ls -la *.ipa
          echo "IPA=OpenUtauMobile-$VERSION-ios-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA }}
          prerelease: true
